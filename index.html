<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود | مدیر فوتبال</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

  <div class="bg-animation">
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
    <div class="circle circle-3"></div>
  </div>

  <div class="login-container">
    <div class="login-card">
      
      <div class="logo-section">
        <div class="logo-icon">⚽</div>
        <h1 class="game-title">مدیر فوتبال</h1>
        <p class="game-subtitle">بهترین تجربه مدیریت فوتبال</p>
      </div>

      <!-- تب‌های ورود / ثبت‌نام -->
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">ورود</button>
        <button class="auth-tab" data-tab="signup">ثبت‌نام</button>
      </div>

      <div class="login-body">
        
        <!-- فرم ورود -->
        <form id="loginForm" class="auth-form">
          <h2>خوش برگشتی، مدیر! 👋</h2>
          <p class="login-desc">با ایمیل و رمزت وارد شو</p>

          <div class="input-group">
            <span class="input-icon">📧</span>
            <input type="email" id="loginEmail" placeholder="ایمیل" required autocomplete="email">
          </div>

          <div class="input-group">
            <span class="input-icon">🔒</span>
            <input type="password" id="loginPassword" placeholder="رمز عبور" required autocomplete="current-password" minlength="6">
          </div>

          <button type="submit" class="primary-btn">
            <span>ورود به بازی</span>
          </button>
        </form>

        <!-- فرم ثبت‌نام -->
        <form id="signupForm" class="auth-form" style="display: none;">
          <h2>خوش آمدی، مدیر جدید! ⚽</h2>
          <p class="login-desc">اکانت بساز تا پیشرفتت ذخیره بمونه</p>

          <div class="input-group">
            <span class="input-icon">👤</span>
            <input type="text" id="signupName" placeholder="اسم مدیر" required minlength="2" maxlength="30">
          </div>

          <div class="input-group">
            <span class="input-icon">📧</span>
            <input type="email" id="signupEmail" placeholder="ایمیل" required autocomplete="email">
          </div>

          <div class="input-group">
            <span class="input-icon">🔒</span>
            <input type="password" id="signupPassword" placeholder="رمز عبور (حداقل ۶ حرف)" required autocomplete="new-password" minlength="6">
          </div>

          <button type="submit" class="primary-btn">
            <span>ساخت اکانت</span>
          </button>
        </form>

        <!-- جداکننده -->
        <div class="divider">
          <span>یا</span>
        </div>

        <!-- دکمه مهمان -->
        <button id="guestLoginBtn" class="social-btn guest-btn" type="button">
          <span class="guest-icon">👤</span>
          <span>بازی به عنوان مهمان</span>
        </button>

        <!-- هشدار مهمان -->
        <div class="guest-warning">
          ⚠️ پیشرفت مهمان فقط روی همین دستگاه ذخیره می‌شه. برای ذخیره دائمی، اکانت بساز!
        </div>

        <div id="errorMessage" class="error-message" role="alert"></div>
        <div id="successMessage" class="success-message" role="alert"></div>
      </div>

      <div class="login-footer">
        <p>با ورود، <a href="#" class="link">شرایط استفاده</a> را می‌پذیرید</p>
      </div>

    </div>
  </div>

  <div id="loadingOverlay" class="loading-overlay" hidden>
    <div class="spinner"></div>
    <p id="loadingText">در حال پردازش...</p>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
