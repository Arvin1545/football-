<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود | مدیر فوتبال</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

  <div class="bg-animation">
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
    <div class="circle circle-3"></div>
  </div>

  <div class="login-container">
    <div class="login-card">
      
      <div class="logo-section">
        <div class="logo-icon">⚽</div>
        <h1 class="game-title">مدیر فوتبال</h1>
        <p class="game-subtitle">بهترین تجربه مدیریت فوتبال</p>
      </div>

      <div class="login-body">
        <h2>خوش آمدی، مدیر!</h2>
        <p class="login-desc">
          برای ذخیره دائمی پیشرفتت، با گوگل وارد شو.
          یا می‌تونی سریع مهمان بازی کنی.
        </p>

        <button id="googleLoginBtn" class="google-btn" type="button">
          <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/>
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
            <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.5l6.2 5.2C41 35.3 44 30 44 24c0-1.3-.1-2.3-.4-3.5z"/>
          </svg>
          <span>ورود با حساب گوگل</span>
        </button>

        <div class="divider">
          <span>یا</span>
        </div>

        <button id="guestLoginBtn" class="guest-btn" type="button">
          <span class="guest-icon">👤</span>
          <span>بازی به عنوان مهمان</span>
        </button>

        <div class="guest-warning">
          ⚠️ پیشرفت مهمان فقط روی همین دستگاه ذخیره می‌شه.
          اگه مرورگر پاک بشه، پیشرفتت می‌پره!
        </div>

        <div id="errorMessage" class="error-message" role="alert"></div>
      </div>

      <div class="login-footer">
        <p>با ورود، <a href="#" class="link">شرایط استفاده</a> را می‌پذیرید</p>
      </div>

    </div>
  </div>

  <div id="loadingOverlay" class="loading-overlay" hidden>
    <div class="spinner"></div>
    <p id="loadingText">در حال ورود...</p>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
