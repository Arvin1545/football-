<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نقل و انتقالات | امپراتور فوتبال</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/transfers.css">
</head>
<body class="game-page transfers-page">

  <header class="game-header">
    <a href="game.html" class="menu-btn back-btn-header"><span>→</span></a>
    <div class="header-title">
      <span class="header-icon">💰</span>
      <span class="header-name">نقل و انتقالات</span>
    </div>
    <div class="header-actions">
      <div class="resource-pill">
        <span>🪙</span>
        <span id="coinsDisplay">0</span>
      </div>
    </div>
  </header>

  <!-- فقط تب بازار -->
  <main class="tab-content active" style="display:block;">
    <section class="transfers-filters">
      <input type="text" id="searchInput" placeholder="🔍 جستجوی بازیکن..." class="search-input">
      <div class="filter-row">
        <select id="positionFilter" class="filter-select">
          <option value="all">همه پست‌ها</option>
          <option value="GK">GK</option>
          <option value="CB">CB</option>
          <option value="LB">LB</option>
          <option value="RB">RB</option>
          <option value="CDM">CDM</option>
          <option value="CM">CM</option>
          <option value="CAM">CAM</option>
          <option value="LW">LW</option>
          <option value="RW">RW</option>
          <option value="ST">ST</option>
        </select>
      </div>
    </section>

    <!-- لیست بازیکنان بازار -->
    <section class="players-market" id="marketList">
      <div class="loading-state">
        <div class="loader-ball">⚽</div>
        <p>در حال بارگذاری بازار...</p>
      </div>
    </section>
  </main>

  <!-- مودال پیشنهاد خرید -->
  <div id="bidModal" class="listing-modal" hidden>
    <div class="listing-modal-content">
      <button class="close-modal-btn" id="closeBidModal">✕</button>
      <div class="listing-header">
        <div class="listing-avatar" id="bidAvatar">👤</div>
        <div class="listing-info">
          <h2 id="bidPlayerName">-</h2>
          <div class="listing-meta" id="bidMeta">-</div>
        </div>
      </div>
      <div class="listing-body">
        <div class="bid-info-box">
          <div class="bid-info-row">
            <span>💰 قیمت پایه:</span>
            <strong id="bidBasePrice">0</strong>
          </div>
        </div>
        <div class="price-section">
          <label class="price-label">💵 پیشنهاد شما</label>
          <div class="price-display">
            <span id="bidAmountDisplay">0</span>
            <span class="currency">€</span>
          </div>
          <input type="range" id="bidAmountSlider" min="0" max="100000000" step="1000000" value="10000000" class="price-slider">
          <div class="price-range-labels">
            <span>قیمت پایه</span>
            <span>بالاتر</span>
            <span>خیلی بالا</span>
          </div>
        </div>
      </div>
      <div class="listing-actions">
        <button class="btn-cancel" id="cancelBid">انصراف</button>
        <button class="btn-publish" id="placeBid">⚔️ ارسال پیشنهاد</button>
      </div>
    </div>
  </div>

  <div id="loadingOverlay" class="loading-overlay" hidden>
    <div class="loader-ball">⚽</div>
    <p id="loadingText">در حال بارگذاری...</p>
  </div>

  <script type="module" src="js/transfers.js"></script>
</body>
</html>
